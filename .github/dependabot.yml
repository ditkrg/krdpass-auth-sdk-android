# Keeps GitHub Actions (SHA-pinned) and Gradle dependencies monitored for updates
# and security advisories.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # Flutter stable still scaffolds plugins at compileSdk 36. These AndroidX
    # lines require compileSdk 37, so adopting them in the shared native core
    # would make the current Flutter plugin impossible to consume.
    ignore:
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]
      - dependency-name: "androidx.activity:activity-ktx"
        versions: [">=1.12.0"]
      - dependency-name: "androidx.lifecycle:lifecycle-runtime-ktx"
        versions: [">=2.10.0"]
      # Kotlin 2.3+ metadata cannot be consumed by the Kotlin 2.1 compiler in
      # the current Expo 55 / React Native 0.83 support matrix.
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"
        versions: [">=2.3.0"]
      # Expo SDK 55 compiles Android consumers with Kotlin 2.1, which can read
      # metadata through 2.2. kotlinx.serialization 1.10+ publishes metadata 2.3.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-json"
        versions: [">=1.10.0"]
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
