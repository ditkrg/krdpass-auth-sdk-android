name: Workflow security

on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    branches: [main]
    paths: ['.github/**']
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.31'
      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uvx --with-requirements .github/zizmor-requirements.txt zizmor
          --persona=auditor --strict-collection --no-ignores
          --collect=workflows --collect=dependabot .github
