[versions]
# Compatibility floor for Maven Central consumers, including the Flutter and RN
# plugins. A newer consumer can read this library; compiling it with a newer
# Kotlin would raise the floor for everyone. Samples track current (2.4.x).
kotlin = "2.4.10"
# AndroidX core/lifecycle/activity are pinned to the latest releases that still support
# compileSdk 36. The newer 1.19/2.11/1.12 lines require compileSdk 37, and Flutter stable
# still scaffolds plugins at 36, so adopting them would make the Flutter plugin unconsumable.
androidxCore = "1.18.0"
junit = "4.13.2"
lifecycle = "2.9.4"
activity = "1.11.0"
nimbus = "10.9.1"
okhttp = "5.4.0"
robolectric = "4.16.1"
asm = "9.10.1"
vanniktechMavenPublish = "0.37.0"
detekt = "1.23.8"
dokka = "2.2.0"
binaryCompatibilityValidator = "0.18.1"

[libraries]
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-lifecycle-common = { group = "androidx.lifecycle", name = "lifecycle-common", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
nimbus-jose-jwt = { group = "com.nimbusds", name = "nimbus-jose-jwt", version.ref = "nimbus" }
squareup-okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
squareup-okhttp-coroutines = { group = "com.squareup.okhttp3", name = "okhttp-coroutines", version.ref = "okhttp" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockwebserver3 = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
asm = { group = "org.ow2.asm", name = "asm", version.ref = "asm" }
asm-tree = { group = "org.ow2.asm", name = "asm-tree", version.ref = "asm" }
kotlin-metadata-jvm = { group = "org.jetbrains.kotlin", name = "kotlin-metadata-jvm", version.ref = "kotlin" }

[plugins]
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
